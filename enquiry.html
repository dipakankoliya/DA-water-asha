<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get a Free Quote | DA Water Treatment Expert Ahmedabad</title>
  <meta name="description" content="Request a free water treatment quote from DA Water in Shela, Ahmedabad. RO plants, purification, ETP/STP, testing and AMC — call +91 9913654239.">
  <link rel="canonical" href="https://www.dawater.in/enquiry.html">
  <meta property="og:title" content="Free Water Treatment Quote | DA Water Ahmedabad">
  <meta property="og:description" content="Tell us your water source and requirement. DA Water responds with a clear next step.">
  <meta property="og:url" content="https://www.dawater.in/enquiry.html">
  <meta name="twitter:title" content="Get a Free Quote | DA Water">
  <meta name="twitter:description" content="Free water audit and quotation for Ahmedabad homes, businesses and industries.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="container">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-3">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Enquiry</li>
          </ol>
        </nav>
        <h1>Get your free water audit & quote</h1>
        <p class="lead">Share a few details. We’ll recommend testing, a site visit, or a scoped quotation — without pressure.</p>
      </div>
    </section>
    <section class="section">
      <div class="container" style="max-width:820px">
        <div class="form-panel reveal">
          <form data-redirect="thank-you.html">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="q-name">Full name</label>
                <input class="form-control" id="q-name" name="name" required autocomplete="name">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="q-phone">Phone</label>
                <input class="form-control" id="q-phone" name="phone" type="tel" required autocomplete="tel">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="q-email">Email</label>
                <input class="form-control" id="q-email" name="email" type="email" autocomplete="email">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="q-type">Property / site type</label>
                <select class="form-select" id="q-type" name="site_type" required>
                  <option value="">Select</option>
                  <option>Residential home / villa</option>
                  <option>Housing society</option>
                  <option>Commercial / office / retail</option>
                  <option>Hotel / F&B</option>
                  <option>Healthcare</option>
                  <option>Industrial / manufacturing</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="q-service">Service needed</label>
                <select class="form-select" id="q-service" name="service" required>
                  <option value="">Select</option>
                  <option>Water purification / drinking RO</option>
                  <option>Commercial / industrial RO plant</option>
                  <option>Water softener / filtration</option>
                  <option>Wastewater ETP / STP</option>
                  <option>Water quality testing</option>
                  <option>Installation / AMC</option>
                  <option>Consulting / plant audit</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="q-source">Water source</label>
                <select class="form-select" id="q-source" name="water_source">
                  <option value="">Select if known</option>
                  <option>Borewell</option>
                  <option>Municipal / society supply</option>
                  <option>Tanker</option>
                  <option>Mixed / process return</option>
                  <option>Not sure</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label" for="q-loc">Site location (area)</label>
                <input class="form-control" id="q-loc" name="location" placeholder="e.g. Shela, Bopal, Vatva…">
              </div>
              <div class="col-12">
                <label class="form-label" for="q-msg">Requirement details</label>
                <textarea class="form-control" id="q-msg" name="message" rows="4" placeholder="Daily water demand, existing system, issues…"></textarea>
              </div>
              <div class="col-12">
                <button class="btn btn-primary btn-lg w-100" type="submit">Submit enquiry</button>
              </div>
            </div>
          </form>
          <p class="mt-3 mb-0 text-secondary small">Prefer talking now? <a href="tel:+919913654239">+91 9913654239</a> · <a href="https://wa.me/919913654239" target="_blank" rel="noopener">WhatsApp</a></p>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="js/main.js"></script>
</body>
</html>
